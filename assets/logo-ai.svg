<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Monogram AI (Aidil Ilham) - Sharp Cyber-Futuristic Geometric Mark -->
  <defs>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="ai-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#990024"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer subtle hexagon / shield guide (optional cyber framing) -->
  <polygon points="100,10 185,55 185,145 100,190 15,145 15,55" stroke="rgba(0, 242, 254, 0.25)" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  
  <!-- Main Monogram Geometry -->
  <g filter="url(#glow)">
    <!-- Letter 'A' Left Pillar & Peak -->
    <path d="M100,28 L35,160 L62,160 L100,82 L138,160 L165,160 Z" fill="#ffffff" />
    
    <!-- Letter 'A' Crossbar (Sharp Cyber Cut) -->
    <polygon points="65,115 135,115 125,135 75,135" fill="url(#ai-glow)" />
    
    <!-- Letter 'I' Central Monolithic Core -->
    <path d="M93,60 L107,60 L107,160 L93,160 Z" fill="url(#ai-glow)" />
    
    <!-- Cyber Accent Blade / Dot -->
    <polygon points="100,15 115,35 85,35" fill="url(#ai-crimson)" />
  </g>
</svg>
